[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[project]
name = "DeOCR"
version = "0.1.0"
authors = [
    {name = "Moenupa", email = "moenupa@gmail.com"}
]
description = "A reverse OCR tool that transforms text datasets (JSON, CSV) to images of `512x512` or `1024x1024`."
readme = "README.md"
requires-python = ">=3.9,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "jsonargparse[signatures]>=4.26.1",
    "datasets",
    "markdown",
    "playwright>=1.49.1,<1.56.0",
]

[dependency-groups]
dev = [
    "pillow>=10.0.0,<=12.0.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.14.2",
    "build",
]

[project.urls]
Homepage = "https://github.com/Moenupa/DeOCR"
Issues = "https://github.com/Moenupa/DeOCR/issues"
